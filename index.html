<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>متابعة التمارين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   نظام التصميم — Design Tokens
   ============================================================ */
:root{
  --teal:#2E9896;
  --teal-dark:#227876;
  --teal-light:#E4F3F2;
  --teal-line:#BFE3E1;

  --ink:#1C2422;
  --ink-soft:#4A5654;
  --ink-faint:#8A9694;

  --paper:#FAFAF8;
  --surface:#FFFFFF;
  --line:#E4E4DF;
  --line-soft:#EEEEE9;

  --amber:#B8792F;
  --amber-bg:#FBF2E4;
  --red:#B5453D;
  --red-bg:#FBEBEA;
  --green:#3F7D52;
  --green-bg:#EBF4EC;

  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:18px;

  --font-body:'IBM Plex Sans Arabic', system-ui, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;

  --shadow-sm:0 1px 2px rgba(28,36,34,0.06);
  --shadow-md:0 4px 16px rgba(28,36,34,0.08);
  --shadow-lg:0 12px 32px rgba(28,36,34,0.12);
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  overscroll-behavior-y:none;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--teal-light);}

.mono{font-family:var(--font-mono); direction:ltr; unicode-bidi:plaintext;}

/* ============================================================
   تخطيط عام للتطبيق
   ============================================================ */
#app{display:none; min-height:100vh; flex-direction:column;}
#app.visible{display:flex;}

.app-header{
  position:sticky; top:0; z-index:40;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between;
}
.app-header .brand{
  font-size:17px; font-weight:700; color:var(--ink);
  display:flex; align-items:baseline; gap:8px;
}
.app-header .brand .accent{color:var(--teal);}
.app-header .header-right{display:flex; align-items:center; gap:10px;}
.header-icon-btn{
  width:38px; height:38px; border-radius:50%;
  border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  color:var(--ink-soft); font-size:14px; font-weight:600;
}
.header-icon-btn:active{background:var(--line-soft);}

main{flex:1; padding:16px 16px 90px; max-width:640px; width:100%; margin:0 auto;}

/* Navigation سفلي (موبايل) */
.bottom-nav{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--surface);
  border-top:1px solid var(--line);
  display:flex; justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px; border:none; background:none; color:var(--ink-faint);
  font-size:10.5px; font-weight:500; border-radius:10px;
}
.nav-item .nav-dot{
  width:20px; height:20px; border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  font-size:12px;
}
.nav-item.active{color:var(--teal-dark);}
.nav-item.active .nav-dot{background:var(--teal-light); color:var(--teal-dark);}

/* ============================================================
   مكونات عامة
   ============================================================ */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
}
.card + .card{margin-top:12px;}
.section-title{
  font-size:13px; font-weight:700; color:var(--ink-soft);
  text-transform:uppercase; letter-spacing:0.03em;
  margin:22px 0 10px;
}
.section-title:first-child{margin-top:0;}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:13px 20px; border-radius:var(--radius-sm);
  font-size:15px; font-weight:600; border:1px solid transparent;
  transition:transform .05s ease;
  width:100%;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--teal); color:#fff;}
.btn-primary:active{background:var(--teal-dark);}
.btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--line);}
.btn-ghost{background:transparent; color:var(--ink-soft); border-color:transparent;}
.btn-danger{background:var(--red-bg); color:var(--red);}
.btn-sm{padding:9px 14px; font-size:13.5px; width:auto;}
.btn:disabled{opacity:0.5; pointer-events:none;}

.input-group{margin-bottom:14px;}
.input-group label{
  display:block; font-size:13px; font-weight:600; color:var(--ink-soft);
  margin-bottom:6px;
}
.input-group .hint{font-size:12px; color:var(--ink-faint); margin-top:5px;}
input[type=text],input[type=number],input[type=password],input[type=email],
input[type=time],input[type=date],select,textarea{
  width:100%; padding:12px 14px; border:1px solid var(--line);
  border-radius:var(--radius-sm); font-size:15px; color:var(--ink);
  background:var(--surface);
}
input:focus,select:focus,textarea:focus{
  outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-light);
}
textarea{resize:vertical; min-height:70px;}

.badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:20px;
}
.badge-teal{background:var(--teal-light); color:var(--teal-dark);}
.badge-amber{background:var(--amber-bg); color:var(--amber);}
.badge-red{background:var(--red-bg); color:var(--red);}
.badge-green{background:var(--green-bg); color:var(--green);}
.badge-gray{background:var(--line-soft); color:var(--ink-faint);}

.divider{height:1px; background:var(--line); margin:14px 0;}

.empty-state{
  text-align:center; padding:40px 20px; color:var(--ink-faint);
}
.empty-state .empty-title{font-size:15px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
.empty-state .empty-sub{font-size:13px;}

.loading-spinner{
  width:22px; height:22px; border-radius:50%;
  border:3px solid var(--line); border-top-color:var(--teal);
  animation:spin .7s linear infinite; margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg);}}

.toast-container{
  position:fixed; top:14px; left:50%; transform:translateX(-50%);
  z-index:200; display:flex; flex-direction:column; gap:8px; width:calc(100% - 32px); max-width:420px;
}
.toast{
  background:var(--ink); color:#fff; padding:12px 16px; border-radius:var(--radius-sm);
  font-size:13.5px; font-weight:500; box-shadow:var(--shadow-lg);
  animation:toast-in .2s ease;
  text-align:center;
}
.toast.success{background:var(--green);}
.toast.error{background:var(--red);}
@keyframes toast-in{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

.modal-overlay{
  position:fixed; inset:0; background:rgba(28,36,34,0.45); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
}
.modal-overlay.centered{align-items:center; padding:20px;}
.modal-sheet{
  background:var(--surface); width:100%; max-width:520px;
  border-radius:20px 20px 0 0; padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:88vh; overflow-y:auto;
  animation:sheet-up .22s ease;
  position:relative;
}
.modal-overlay.centered .modal-sheet{border-radius:var(--radius-lg); max-height:80vh;}
@keyframes sheet-up{from{transform:translateY(24px); opacity:0.6;} to{transform:translateY(0); opacity:1;}}
.modal-title{font-size:17px; font-weight:700; margin-bottom:16px;}
.modal-close{
  position:absolute; top:16px; left:16px;
  width:32px; height:32px; border-radius:50%; border:none; background:var(--line-soft);
  color:var(--ink-soft); font-size:16px;
}

/* ============================================================
   Auth
   ============================================================ */
#auth-screen{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px; background:var(--paper);
}
.auth-box{width:100%; max-width:380px;}
.auth-logo{text-align:center; margin-bottom:28px;}
.auth-logo .mark{
  width:56px; height:56px; border-radius:16px; background:var(--teal);
  margin:0 auto 14px; display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:22px; font-weight:700;
}
.auth-logo h1{font-size:19px; font-weight:700;}
.auth-logo p{font-size:13px; color:var(--ink-faint); margin-top:4px;}
.auth-tabs{display:flex; background:var(--line-soft); border-radius:10px; padding:3px; margin-bottom:20px;}
.auth-tab{flex:1; padding:10px; border:none; background:none; border-radius:8px; font-size:14px; font-weight:600; color:var(--ink-faint);}
.auth-tab.active{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm);}
.auth-error{
  background:var(--red-bg); color:var(--red); font-size:13px; padding:10px 12px;
  border-radius:var(--radius-sm); margin-bottom:14px; display:none;
}

/* ============================================================
   Dashboard
   ============================================================ */
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.stat-box{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:14px;
}
.stat-box .stat-label{font-size:12px; color:var(--ink-faint); font-weight:500;}
.stat-box .stat-value{font-size:22px; font-weight:700; margin-top:4px;}
.stat-box .stat-value .unit{font-size:13px; font-weight:500; color:var(--ink-faint);}

.hero-card{
  background:linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
  color:#fff; border-radius:var(--radius-lg); padding:22px 20px;
  box-shadow:var(--shadow-md);
}
.hero-card .eyebrow{font-size:12px; opacity:0.85; font-weight:600; letter-spacing:0.02em;}
.hero-card h2{font-size:22px; font-weight:700; margin:6px 0 4px;}
.hero-card .sub{font-size:13.5px; opacity:0.9;}
.hero-card .btn-primary{background:#fff; color:var(--teal-dark); margin-top:16px;}

.list-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 0; border-bottom:1px solid var(--line-soft);
}
.list-row:last-child{border-bottom:none;}
.list-row .title{font-size:14.5px; font-weight:600;}
.list-row .sub{font-size:12.5px; color:var(--ink-faint); margin-top:2px;}

/* ============================================================
   تمرين مباشر / Live Workout
   ============================================================ */
.workout-timer-bar{
  position:sticky; top:0; z-index:41; background:var(--ink); color:#fff;
  padding:10px 18px; display:flex; align-items:center; justify-content:space-between;
  font-size:13px;
}
.workout-timer-bar .timer{font-family:var(--font-mono); font-size:16px; font-weight:600; direction:ltr;}

.exercise-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:16px; margin-bottom:12px;
}
.exercise-card.done{border-color:var(--teal-line); background:var(--teal-light);}
.exercise-card .ex-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;}
.exercise-card .ex-name-ar{font-size:15.5px; font-weight:700;}
.exercise-card .ex-name-en{font-size:12px; color:var(--ink-faint);}
.last-performance{
  background:var(--line-soft); border-radius:var(--radius-sm); padding:10px 12px;
  font-size:12.5px; color:var(--ink-soft); margin-bottom:10px;
}
.last-performance .lp-label{font-weight:600; color:var(--ink-faint); font-size:11px; margin-bottom:4px;}
.suggested-box{
  display:flex; align-items:center; gap:8px; background:var(--teal-light);
  color:var(--teal-dark); border-radius:var(--radius-sm); padding:9px 12px; font-size:13px;
  font-weight:600; margin-bottom:12px;
}

.set-table{width:100%; border-collapse:collapse; margin-bottom:10px; table-layout:fixed;}
.set-table th{
  font-size:10.5px; color:var(--ink-faint); font-weight:600; text-align:center; padding:4px 1px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.set-table col.col-num{width:26px;}
.set-table col.col-check{width:38px;}
.set-table td{padding:4px 2px; text-align:center;}
.set-table input{
  width:100%; padding:9px 2px; text-align:center; font-size:13px;
  border:1px solid var(--line); border-radius:7px; min-width:0;
}
.set-row-num{font-size:13px; font-weight:700; color:var(--ink-faint); width:22px;}
.set-check-btn{
  width:34px; height:34px; border-radius:8px; border:1.5px solid var(--line);
  background:var(--surface); color:var(--ink-faint); font-size:15px;
  display:flex; align-items:center; justify-content:center;
}
.set-check-btn.checked{background:var(--teal); border-color:var(--teal); color:#fff;}
.set-row.warmup .set-row-num{color:var(--amber);}

.rpe-rir-row{display:flex; gap:8px; margin-bottom:10px;}
.rpe-rir-row .input-group{flex:1; margin-bottom:0;}
.rpe-rir-row label{font-size:11.5px;}

.ex-actions{display:flex; gap:8px;}
.ex-actions .btn{flex:1;}

/* Rest timer overlay */
.rest-timer-bar{
  position:fixed; bottom:64px; left:0; right:0; z-index:60;
  background:var(--ink); color:#fff; padding:14px 18px;
  display:flex; align-items:center; justify-content:space-between;
  box-shadow:0 -4px 16px rgba(0,0,0,0.2);
}
.rest-timer-bar .rt-time{font-family:var(--font-mono); font-size:24px; font-weight:700;}
.rest-timer-bar .rt-label{font-size:12px; opacity:0.8;}
.rest-timer-bar button{
  background:rgba(255,255,255,0.15); border:none; color:#fff;
  width:36px; height:36px; border-radius:50%; font-size:14px; margin-inline-start:6px;
}

/* Feeling check screen */
.feeling-options{display:flex; flex-direction:column; gap:10px;}
.feeling-opt{
  display:flex; align-items:center; gap:12px;
  border:1.5px solid var(--line); border-radius:var(--radius-md); padding:14px 16px;
  background:var(--surface); text-align:right; width:100%;
}
.feeling-opt .fo-dot{
  width:36px; height:36px; border-radius:10px; background:var(--line-soft);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
}
.feeling-opt.selected{border-color:var(--teal); background:var(--teal-light);}
.feeling-opt.selected .fo-dot{background:var(--teal); color:#fff;}
.feeling-opt .fo-text{flex:1;}
.feeling-opt .fo-title{font-size:14.5px; font-weight:700;}
.feeling-opt .fo-sub{font-size:12px; color:var(--ink-faint); margin-top:2px;}

.recommend-list{list-style:none; margin-top:12px;}
.recommend-list li{
  padding:9px 0 9px 0; padding-inline-start:20px; position:relative;
  font-size:13.5px; color:var(--ink-soft); border-bottom:1px solid var(--line-soft);
}
.recommend-list li:before{
  content:"—"; position:absolute; inset-inline-start:0; color:var(--teal);
}
.recommend-list li:last-child{border-bottom:none;}

.warning-banner{
  background:var(--red-bg); border:1px solid #EBCAC7; color:var(--red);
  border-radius:var(--radius-md); padding:14px 16px; font-size:13.5px; line-height:1.6;
}
.warning-banner strong{display:block; margin-bottom:4px; font-size:14px;}

/* Calendar */
.week-strip{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;}
.day-chip{
  flex:1; min-width:60px; text-align:center; padding:10px 6px;
  border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface);
}
.day-chip .dc-name{font-size:11px; color:var(--ink-faint); font-weight:600;}
.day-chip .dc-date{font-size:14px; font-weight:700; margin:3px 0;}
.day-chip .dc-status{font-size:10px; margin-top:2px;}
.day-chip.today{border-color:var(--teal); border-width:1.5px;}
.day-chip.completed{background:var(--green-bg);}
.day-chip.missed{background:var(--red-bg);}
.day-chip.rest{background:var(--line-soft);}

/* Tabs */
.tab-bar{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto;}
.tab-btn{
  padding:9px 16px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
  font-size:13px; font-weight:600; color:var(--ink-soft); white-space:nowrap;
}
.tab-btn.active{background:var(--ink); color:#fff; border-color:var(--ink);}

/* Progress charts (simple bars/lines via SVG) */
.chart-wrap{width:100%; overflow-x:auto;}
.chart-legend{display:flex; gap:14px; font-size:12px; color:var(--ink-soft); margin-top:8px;}
.chart-legend .lg-dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-inline-end:5px;}

/* Exercise library rows */
.lib-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 0; border-bottom:1px solid var(--line-soft);
}
.lib-row .lr-info{flex:1;}
.lib-row .lr-name{font-size:14px; font-weight:600;}
.lib-row .lr-meta{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}
.lib-actions{display:flex; gap:6px;}
.icon-btn-sm{
  width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-faint); font-size:13px;
}

.search-box{position:relative; margin-bottom:14px;}
.search-box input{padding-inline-start:14px;}

/* Utility */
.flex{display:flex;}
.flex-col{display:flex; flex-direction:column;}
.gap-8{gap:8px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.text-center{text-align:center;}
.mt-8{margin-top:8px;} .mt-12{margin-top:12px;} .mt-16{margin-top:16px;} .mt-20{margin-top:20px;}
.mb-8{margin-bottom:8px;} .mb-12{margin-bottom:12px;}
.text-faint{color:var(--ink-faint);}
.text-sm{font-size:13px;}
.font-bold{font-weight:700;}
.hidden{display:none !important;}
.w-full{width:100%;}

@media (min-width:720px){
  main{padding:24px 16px 40px;}
  .bottom-nav{position:static; border-top:none; border-bottom:1px solid var(--line); max-width:640px; margin:0 auto; background:var(--paper);}
}
</style>
</head>
<body>

<div class="toast-container" id="toast-container"></div>

<!-- ============================================================
     شاشة تسجيل الدخول
     ============================================================ -->
<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="mark">GT</div>
      <h1>متابعة التمارين</h1>
      <p>سجّل تمارينك، وتابع تقدمك خطوة بخطوة</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">تسجيل الدخول</button>
      <button class="auth-tab" data-tab="signup" onclick="switchAuthTab('signup')">حساب جديد</button>
    </div>

    <div class="auth-error" id="auth-error"></div>

    <form id="login-form" onsubmit="return handleLogin(event)">
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" id="login-btn">دخول</button>
    </form>

    <form id="signup-form" class="hidden" onsubmit="return handleSignup(event)">
      <div class="input-group">
        <label>الاسم</label>
        <input type="text" id="signup-name" required>
      </div>
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="signup-email" required autocomplete="email">
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
        <div class="hint">6 أحرف على الأقل</div>
      </div>
      <button type="submit" class="btn btn-primary" id="signup-btn">إنشاء حساب</button>
    </form>
  </div>
</div>

<!-- ============================================================
     التطبيق الرئيسي
     ============================================================ -->
<div id="app">
  <header class="app-header">
    <div class="brand"><span id="header-app-name">متابعة التمارين</span></div>
    <div class="header-right">
      <button class="header-icon-btn" onclick="navigateTo('settings')" title="الإعدادات">⚙</button>
    </div>
  </header>

  <main id="main-content">
    <!-- المحتوى يُحقن ديناميكيًا -->
  </main>

  <nav class="bottom-nav">
    <button class="nav-item" data-page="dashboard" onclick="navigateTo('dashboard')">
      <span class="nav-dot">⌂</span><span>الرئيسية</span>
    </button>
    <button class="nav-item" data-page="today" onclick="navigateTo('today')">
      <span class="nav-dot">◉</span><span>تمرين اليوم</span>
    </button>
    <button class="nav-item" data-page="schedule" onclick="navigateTo('schedule')">
      <span class="nav-dot">▦</span><span>الجدول</span>
    </button>
    <button class="nav-item" data-page="progress" onclick="navigateTo('progress')">
      <span class="nav-dot">▲</span><span>التقدم</span>
    </button>

      <span class="nav-dot">≡</span><span>السجل</span>
    </button>
  </nav>
</div>

<script>
/* ============================================================
   الجزء 1: الإعدادات والاتصال بـ Supabase
   ============================================================ */
const SUPABASE_URL = ''; // ضع رابط مشروع Supabase هنا، مثال: https://xxxx.supabase.co
const SUPABASE_ANON_KEY = ''; // ضع الـ anon/publishable key هنا فقط. لا تضع service_role key أبدًا.

let supabase = null;
let supabaseReady = false;

function initSupabase(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    console.warn('لم يتم إعداد بيانات اتصال Supabase بعد.');
    return false;
  }
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  supabaseReady = true;
  return true;
}

/* ============================================================
   الجزء 2: حالة التطبيق العامة
   ============================================================ */
const LB_PER_KG = 2.20462;

const state = {
  user: null,
  profile: null,
  settings: null,
  workoutDays: [],       // قوالب أيام البرنامج (مرتبة)
  scheduleState: null,   // اليوم القادم + streak
  currentPage: 'dashboard',
  activeSession: null,   // جلسة تمرين جارية (كائن كامل مع تمارين ومجموعات محليًا)
  exerciseCache: [],     // مكتبة التمارين (افتراضية + مخصصة)
  categoryCache: [],
  restTimer: {seconds:0, running:false, intervalId:null, label:''},
  workoutTimerIntervalId: null,
  offlineQueue: [], // للعمليات التي فشلت بسبب ضعف الاتصال (workout_sets بشكل أساسي)
};

const OFFLINE_QUEUE_KEY = 'gt_offline_queue_v1';
const LOCAL_SESSION_KEY = 'gt_active_session_v1';

/* ============================================================
   أدوات مساعدة عامة
   ============================================================ */
function kgToLb(kg){ return Math.round(kg * LB_PER_KG * 10) / 10; }
function lbToKg(lb){ return Math.round((lb / LB_PER_KG) * 100) / 100; }

function formatWeight(kg){
  if(kg == null) return '—';
  const lb = kgToLb(kg);
  return `${lb} lb <span class="text-faint">(${kg} kg)</span>`;
}
function formatWeightPlain(kg){
  if(kg == null) return '—';
  return `${kgToLb(kg)} lb (${kg} kg)`;
}

function showToast(message, type=''){
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = message;
  container.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3200);
}

function escapeHtml(str){
  if(str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function formatDateAr(dateStr){
  const d = new Date(dateStr);
  const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

function formatDuration(seconds){
  if(!seconds) return '—';
  const h = Math.floor(seconds/3600);
  const m = Math.floor((seconds%3600)/60);
  if(h > 0) return `${h} ساعة و ${m} دقيقة`;
  return `${m} دقيقة`;
}

function nowRiyadhISO(){
  // Asia/Riyadh = UTC+3 بدون توقيت صيفي
  return new Date().toISOString();
}

function todayDateStr(){
  // تاريخ اليوم بتوقيت الرياض (UTC+3) بصيغة YYYY-MM-DD
  const now = new Date();
  const riyadh = new Date(now.getTime() + (3*60 - now.getTimezoneOffset())*60000);
  return riyadh.toISOString().slice(0,10);
}

function loadOfflineQueue(){
  try{
    const raw = localStorage.getItem(OFFLINE_QUEUE_KEY);
    state.offlineQueue = raw ? JSON.parse(raw) : [];
  }catch(e){ state.offlineQueue = []; }
}
function saveOfflineQueue(){
  localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(state.offlineQueue));
}
function queueOfflineOp(op){
  state.offlineQueue.push(op);
  saveOfflineQueue();
}
async function flushOfflineQueue(){
  if(!navigator.onLine || state.offlineQueue.length === 0) return;
  const queue = [...state.offlineQueue];
  state.offlineQueue = [];
  saveOfflineQueue();
  for(const op of queue){
    try{
      if(op.table === 'workout_sets'){
        await supabase.from('workout_sets').upsert(op.data);
      }
    }catch(e){
      state.offlineQueue.push(op); // أعد الإدراج إذا فشل مجددًا
    }
  }
  saveOfflineQueue();
  if(state.offlineQueue.length === 0){
    showToast('تمت مزامنة بيانات التمرين مع الخادم', 'success');
  }
}
window.addEventListener('online', flushOfflineQueue);

function saveActiveSessionLocally(){
  try{ localStorage.setItem(LOCAL_SESSION_KEY, JSON.stringify(state.activeSession)); }catch(e){}
}
function loadActiveSessionLocally(){
  try{
    const raw = localStorage.getItem(LOCAL_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearActiveSessionLocally(){
  localStorage.removeItem(LOCAL_SESSION_KEY);
}

/* ============================================================
   الجزء 3: المصادقة (Authentication)
   ============================================================ */
function switchAuthTab(tab){
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
  document.getElementById('signup-form').classList.toggle('hidden', tab !== 'signup');
  hideAuthError();
}

function showAuthError(msg){
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideAuthError(){
  document.getElementById('auth-error').style.display = 'none';
}

function checkSupabaseConfigured(){
  if(!supabaseReady){
    showAuthError('لم يتم إعداد بيانات اتصال Supabase بعد. أضف SUPABASE_URL و SUPABASE_ANON_KEY داخل الكود.');
    return false;
  }
  return true;
}

async function handleLogin(e){
  e.preventDefault();
  hideAuthError();
  if(!checkSupabaseConfigured()) return false;

  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'جاري الدخول...';

  try{
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) throw error;
    await onAuthSuccess(data.user);
  }catch(err){
    showAuthError(translateAuthError(err.message));
  }finally{
    btn.disabled = false; btn.textContent = 'دخول';
  }
  return false;
}

async function handleSignup(e){
  e.preventDefault();
  hideAuthError();
  if(!checkSupabaseConfigured()) return false;

  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim();
  const password = document.getElementById('signup-password').value;
  const btn = document.getElementById('signup-btn');
  btn.disabled = true; btn.textContent = 'جاري الإنشاء...';

  try{
    const { data, error } = await supabase.auth.signUp({
      email, password,
      options: { data: { display_name: name } }
    });
    if(error) throw error;

    if(data.user && !data.session){
      showAuthError('تم إنشاء الحساب. إذا كان مفعّلًا التحقق عبر البريد، افتح رسالة التأكيد ثم سجّل الدخول.');
      switchAuthTab('login');
    }else if(data.session){
      await onAuthSuccess(data.user);
    }
  }catch(err){
    showAuthError(translateAuthError(err.message));
  }finally{
    btn.disabled = false; btn.textContent = 'إنشاء حساب';
  }
  return false;
}

function translateAuthError(msg){
  if(!msg) return 'حدث خطأ غير متوقع. حاول مرة أخرى.';
  const m = msg.toLowerCase();
  if(m.includes('invalid login credentials')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if(m.includes('user already registered')) return 'هذا البريد الإلكتروني مسجّل مسبقًا.';
  if(m.includes('password should be at least')) return 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
  if(m.includes('unable to validate email') || m.includes('invalid email')) return 'صيغة البريد الإلكتروني غير صحيحة.';
  if(m.includes('failed to fetch') || m.includes('network')) return 'تعذر الاتصال بالخادم. تحقق من الإنترنت أو من بيانات اتصال Supabase.';
  return msg;
}

async function handleLogout(){
  try{
    await supabase.auth.signOut();
  }catch(e){}
  state.user = null;
  state.profile = null;
  state.settings = null;
  document.getElementById('app').classList.remove('visible');
  document.getElementById('auth-screen').style.display = 'flex';
}

async function onAuthSuccess(user){
  state.user = user;
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  await loadUserData();
  navigateTo('dashboard');
}

/* تحميل كل بيانات المستخدم الأساسية بعد الدخول */
async function loadUserData(){
  try{
    const [{data: profile}, {data: settings}, {data: schedState}, {data: days}, {data: exercises}, {data: categories}] = await Promise.all([
      supabase.from('profiles').select('*').eq('id', state.user.id).single(),
      supabase.from('user_settings').select('*').eq('user_id', state.user.id).single(),
      supabase.from('schedule_state').select('*').eq('user_id', state.user.id).single(),
      supabase.from('workout_days').select('*, workout_day_exercises(*, exercises(*))').eq('user_id', state.user.id).order('day_order'),
      supabase.from('exercises').select('*').or(`user_id.is.null,user_id.eq.${state.user.id}`).order('sort_order'),
      supabase.from('exercise_categories').select('*').order('sort_order'),
    ]);

    state.profile = profile;
    state.settings = settings;
    state.scheduleState = schedState;
    state.workoutDays = days || [];
    state.exerciseCache = exercises || [];
    state.categoryCache = categories || [];

    document.getElementById('header-app-name').textContent = state.profile?.display_name
      ? `تمارين ${state.profile.display_name}`
      : 'متابعة التمارين';

    // إذا لم يوجد برنامج تمارين أساسي بعد لهذا المستخدم، أنشئه تلقائيًا
    if(!state.workoutDays || state.workoutDays.length === 0){
      await createDefaultWorkoutProgram();
    }

    // استرجاع جلسة تمرين محفوظة محليًا (انقطاع اتصال أو إغلاق مفاجئ)
    const localSession = loadActiveSessionLocally();
    if(localSession && localSession.status === 'in_progress'){
      state.activeSession = localSession;
    }

    loadOfflineQueue();
    flushOfflineQueue();
  }catch(err){
    console.error(err);
    showToast('تعذر تحميل بيانات الحساب. تحقق من الاتصال.', 'error');
  }
}

/* إنشاء برنامج التمارين الأساسي (4 أيام) تلقائيًا لأول مرة */
async function createDefaultWorkoutProgram(){
  const dayDefs = [
    {order:1, name_ar:'صدر + ترايسبس', name_en:'Chest + Triceps', groups:['chest','arms']},
    {order:2, name_ar:'ظهر + بايسبس', name_en:'Back + Biceps', groups:['back','arms']},
    {order:3, name_ar:'أكتاف + ترابيس + سواعد', name_en:'Shoulders + Traps + Forearms', groups:['shoulders','arms']},
    {order:4, name_ar:'أرجل', name_en:'Legs', groups:['legs']},
  ];

  const createdDays = [];
  for(const d of dayDefs){
    const { data, error } = await supabase.from('workout_days').insert({
      user_id: state.user.id, day_order: d.order, name_ar: d.name_ar, name_en: d.name_en, muscle_groups: d.groups
    }).select().single();
    if(error){ console.error(error); continue; }
    createdDays.push(data);

    // اختر تمارين افتراضية مناسبة لهذا اليوم من exercise_categories
    const dayExercises = state.exerciseCache.filter(ex =>
      d.groups.includes(ex.primary_muscle) && ex.is_default
    ).sort((a,b)=> a.sort_order - b.sort_order);

    let sortOrder = 0;
    for(const ex of dayExercises){
      await supabase.from('workout_day_exercises').insert({
        workout_day_id: data.id, exercise_id: ex.id, sort_order: sortOrder++,
        target_sets: ex.suggested_sets, target_rep_range: ex.suggested_rep_range
      });
    }
  }

  // عيّن اليوم الأول كتمرين قادم
  if(createdDays.length > 0){
    await supabase.from('schedule_state').update({ next_workout_day_id: createdDays[0].id }).eq('user_id', state.user.id);
  }

  // أعد تحميل البيانات بعد الإنشاء
  const [{data: days}, {data: schedState}] = await Promise.all([
    supabase.from('workout_days').select('*, workout_day_exercises(*, exercises(*))').eq('user_id', state.user.id).order('day_order'),
    supabase.from('schedule_state').select('*').eq('user_id', state.user.id).single(),
  ]);
  state.workoutDays = days || [];
  state.scheduleState = schedState;
}

/* التحقق من الجلسة الحالية عند تحميل الصفحة */
async function checkExistingSession(){
  if(!initSupabase()){
    document.getElementById('auth-screen').style.display = 'flex';
    showAuthError('لم يتم إعداد بيانات اتصال Supabase بعد. راجع أعلى الكود لإضافة SUPABASE_URL و SUPABASE_ANON_KEY.');
    return;
  }
  const { data: { session } } = await supabase.auth.getSession();
  if(session && session.user){
    await onAuthSuccess(session.user);
  }else{
    document.getElementById('auth-screen').style.display = 'flex';
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if(event === 'SIGNED_OUT'){
      state.user = null;
    }
  });
}

window.addEventListener('DOMContentLoaded', checkExistingSession);

/* ============================================================
   الجزء 4: التنقل (Router)
   ============================================================ */
const pageRenderers = {}; // يُملأ لاحقًا بكل صفحة: dashboard, today, schedule, progress, history, settings

function navigateTo(page){
  state.currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  const main = document.getElementById('main-content');
  main.innerHTML = '<div class="text-center mt-20"><div class="loading-spinner"></div></div>';
  window.scrollTo(0,0);

  if(pageRenderers[page]){
    pageRenderers[page](main);
  }else{
    main.innerHTML = `<div class="empty-state"><div class="empty-title">قريبًا</div></div>`;
  }
}

/* ============================================================
   الجزء 5: منطق الجدولة الذكية
   ============================================================ */
function getNextWorkoutDay(){
  if(!state.scheduleState || !state.scheduleState.next_workout_day_id) return state.workoutDays[0] || null;
  return state.workoutDays.find(d => d.id === state.scheduleState.next_workout_day_id) || state.workoutDays[0];
}

function getDayAfter(dayId){
  const idx = state.workoutDays.findIndex(d => d.id === dayId);
  if(idx === -1) return state.workoutDays[0];
  return state.workoutDays[(idx + 1) % state.workoutDays.length];
}

/* يُستدعى بعد إنهاء تمرين بنجاح: ينقل "اليوم القادم" للتمرين التالي في الترتيب */
async function advanceScheduleAfterCompletion(completedDayId){
  const next = getDayAfter(completedDayId);
  const today = todayDateStr();

  await supabase.from('schedule_state').update({
    next_workout_day_id: next.id,
    last_workout_date: today,
    current_streak: (state.scheduleState?.current_streak || 0) + 1,
  }).eq('user_id', state.user.id);

  await supabase.from('schedule_events').insert({
    user_id: state.user.id, workout_day_id: completedDayId, event_date: today, status: 'completed'
  });

  state.scheduleState = { ...state.scheduleState, next_workout_day_id: next.id, last_workout_date: today,
    current_streak: (state.scheduleState?.current_streak || 0) + 1 };
}

/* يُستدعى عند "لم أتمرن اليوم": يسجل الفوات ويُبقي نفس اليوم كتمرين قادم (لا يتقدم الترتيب) */
async function markWorkoutMissed(reason, reasonNote){
  const current = getNextWorkoutDay();
  const today = todayDateStr();

  await supabase.from('schedule_events').insert({
    user_id: state.user.id, workout_day_id: current?.id || null, event_date: today,
    status: 'missed', reason, reason_note: reasonNote || null
  });

  // لا نغيّر next_workout_day_id — يبقى نفس التمرين القادم كما هو
  await supabase.from('schedule_state').update({ current_streak: 0 }).eq('user_id', state.user.id);
  state.scheduleState = { ...state.scheduleState, current_streak: 0 };

  showToast('تم تسجيل يوم الراحة. سيبقى نفس التمرين هو التالي في ترتيبك.', 'success');
}

/* تخطي فعلي (اختياري من المستخدم) — ينقل للتمرين التالي في الترتيب رغم عدم التنفيذ */
async function skipToNextWorkout(reason){
  const current = getNextWorkoutDay();
  const today = todayDateStr();
  const next = getDayAfter(current.id);

  await supabase.from('schedule_events').insert({
    user_id: state.user.id, workout_day_id: current?.id || null, event_date: today,
    status: 'skipped', reason: reason || 'تخطي يدوي'
  });

  await supabase.from('schedule_state').update({ next_workout_day_id: next.id, current_streak: 0 }).eq('user_id', state.user.id);
  state.scheduleState = { ...state.scheduleState, next_workout_day_id: next.id, current_streak: 0 };

  showToast('تم تجاوز هذا التمرين. التمرين القادم الآن: ' + next.name_ar, 'success');
}

/* ============================================================
   الجزء 6: منطق Progressive Overload — "الذكاء" في الاقتراحات
   ============================================================ */

/* جلب آخر أداء مكتمل لتمرين معين (آخر جلسة تحتوي عليه) */
async function getLastPerformance(exerciseId){
  const { data, error } = await supabase
    .from('workout_exercises')
    .select('id, session_id, workout_sets(*), workout_sessions!inner(started_at, status, user_id)')
    .eq('exercise_id', exerciseId)
    .eq('workout_sessions.user_id', state.user.id)
    .eq('workout_sessions.status', 'completed')
    .limit(30); // نجلب دفعة معقولة ونرتبها يدويًا لتفادي قيود ترتيب الجداول المرتبطة في PostgREST

  if(error || !data || data.length === 0) return null;

  // نرتب تنازليًا حسب تاريخ بدء الجلسة ونأخذ الأحدث
  const sorted = data.slice().sort((a,b) =>
    new Date(b.workout_sessions.started_at) - new Date(a.workout_sessions.started_at)
  );
  const record = sorted[0];
  const sets = (record.workout_sets || []).filter(s => !s.is_warmup).sort((a,b)=>a.set_number-b.set_number);
  if(sets.length === 0) return null;
  return { sets, date: record.workout_sessions.started_at };
}

/* حساب الوزن والتكرارات المقترحة بناء على آخر أداء (منطق محافظ) */
function calculateProgressiveSuggestion(lastSets, repRangeStr){
  if(!lastSets || lastSets.length === 0) return null;

  // نحلل النطاق المستهدف مثل "8-12"
  let repMax = 12;
  const match = (repRangeStr || '8-12').match(/(\d+)\s*-\s*(\d+)/);
  if(match) repMax = parseInt(match[2]);

  // نأخذ آخر مجموعة عمل (أو أثقل مجموعة) كمرجع
  const heaviestSet = lastSets.reduce((max, s) => s.weight_kg > max.weight_kg ? s : max, lastSets[0]);
  const lastRir = lastSets[lastSets.length-1].rir;
  const hitTopOfRange = lastSets.every(s => s.reps >= repMax);
  const strugglingReps = lastSets.some(s => s.reps < (repMax - 4)); // فشل واضح دون الحد الأدنى المعقول
  const veryLowRir = lastRir != null && lastRir <= 0;

  let suggestedWeight = heaviestSet.weight_kg;
  let note = 'حافظ على نفس الوزن — التركيز على تحسين الأداء أولًا.';

  if(hitTopOfRange && !veryLowRir === false && !strugglingReps){
    // أداء ممتاز: حقق الحد الأعلى من النطاق
    const increment = heaviestSet.weight_kg >= 40 ? 2.5 : 1.25; // زيادة محافظة بالكيلو
    suggestedWeight = Math.round((heaviestSet.weight_kg + increment) * 4) / 4;
    note = 'حققت الحد الأعلى من التكرارات المستهدفة. اقتراح زيادة تدريجية وآمنة.';
  }else if(strugglingReps){
    suggestedWeight = heaviestSet.weight_kg;
    note = 'التكرارات كانت أقل من المطلوب في المرة الماضية. لا داعي لرفع الوزن الآن.';
  }else{
    note = 'أداء ضمن النطاق المتوقع. حافظ على نفس الوزن وحاول تحسين التكرارات هذه المرة.';
  }

  return {
    weight_kg: suggestedWeight,
    weight_lb: kgToLb(suggestedWeight),
    rep_range: repRangeStr,
    note,
  };
}

/* اكتشاف الأرقام القياسية بعد تسجيل مجموعة */
async function checkAndRecordPRs(exerciseId, set){
  const prs = [];
  const volume = set.weight_kg * set.reps;
  const estimated1RM = Math.round(set.weight_kg * (1 + set.reps/30) * 100) / 100;

  const checks = [
    { type:'max_weight', value: set.weight_kg },
    { type:'max_reps', value: set.reps },
    { type:'best_volume', value: volume },
    { type:'estimated_1rm', value: estimated1RM },
  ];

  for(const check of checks){
    const { data: existing } = await supabase
      .from('personal_records')
      .select('*')
      .eq('user_id', state.user.id)
      .eq('exercise_id', exerciseId)
      .eq('record_type', check.type)
      .order('value', { ascending:false })
      .limit(1);

    const currentBest = existing && existing[0] ? existing[0].value : 0;
    if(check.value > currentBest){
      await supabase.from('personal_records').insert({
        user_id: state.user.id, exercise_id: exerciseId, record_type: check.type,
        value: check.value, weight_kg: set.weight_kg, reps: set.reps,
      });
      prs.push(check.type);
    }
  }
  return prs;
}

/* ============================================================
   الجزء 8: مؤقت الراحة (Rest Timer)
   ============================================================ */
function startRestTimer(seconds, label){
  stopRestTimer();
  state.restTimer = { seconds, running:true, intervalId:null, label };
  renderRestTimerBar();

  state.restTimer.intervalId = setInterval(() => {
    state.restTimer.seconds -= 1;
    if(state.restTimer.seconds <= 0){
      stopRestTimer();
      showToast('انتهت فترة الراحة — استعد للمجموعة التالية', 'success');
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      return;
    }
    updateRestTimerDisplay();
  }, 1000);
}

function stopRestTimer(){
  if(state.restTimer.intervalId) clearInterval(state.restTimer.intervalId);
  state.restTimer.running = false;
  const bar = document.getElementById('rest-timer-bar');
  if(bar) bar.remove();
}

function adjustRestTimer(deltaSeconds){
  if(!state.restTimer.running) return;
  state.restTimer.seconds = Math.max(0, state.restTimer.seconds + deltaSeconds);
  updateRestTimerDisplay();
}

function renderRestTimerBar(){
  let bar = document.getElementById('rest-timer-bar');
  if(!bar){
    bar = document.createElement('div');
    bar.id = 'rest-timer-bar';
    bar.className = 'rest-timer-bar';
    document.body.appendChild(bar);
  }
  bar.innerHTML = `
    <div>
      <div class="rt-label">وقت الراحة — ${escapeHtml(state.restTimer.label || '')}</div>
      <div class="rt-time mono" id="rt-time-display">${formatTimerMMSS(state.restTimer.seconds)}</div>
    </div>
    <div>
      <button onclick="adjustRestTimer(-15)">-15</button>
      <button onclick="adjustRestTimer(15)">+15</button>
      <button onclick="stopRestTimer()">✕</button>
    </div>`;
}
function updateRestTimerDisplay(){
  const el = document.getElementById('rt-time-display');
  if(el) el.textContent = formatTimerMMSS(state.restTimer.seconds);
}
function formatTimerMMSS(totalSeconds){
  const m = Math.floor(totalSeconds/60);
  const s = totalSeconds%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* إنشاء جلسة تمرين جديدة في Supabase وبدء المؤقت */
async function startWorkoutSession(workoutDay, feelingState){
  try{
    const { data: sessionRow, error } = await supabase.from('workout_sessions').insert({
      user_id: state.user.id,
      workout_day_id: workoutDay.id,
      day_name_ar: workoutDay.name_ar,
      day_name_en: workoutDay.name_en,
      feeling_state: feelingState,
      started_at: nowRiyadhISO(),
      status: 'in_progress',
    }).select().single();

    if(error) throw error;

    const exercises = (workoutDay.workout_day_exercises || [])
      .sort((a,b)=>a.sort_order-b.sort_order)
      .map(wde => ({
        workout_day_exercise_id: wde.id,
        exercise: wde.exercises,
        target_sets: wde.target_sets,
        target_rep_range: wde.target_rep_range,
        db_id: null, // سيُملأ عند إنشاء workout_exercises فعليًا في DB
        lastPerformance: null,
        suggestion: null,
        sets: [], // كل عنصر: {set_number, weight_kg, reps, rpe, rir, is_warmup, notes, checked, db_id}
        notes: '',
        completed: false,
      }));

    state.activeSession = {
      db_id: sessionRow.id,
      workoutDayId: workoutDay.id,
      dayNameAr: workoutDay.name_ar,
      dayNameEn: workoutDay.name_en,
      feelingState,
      startedAt: sessionRow.started_at,
      status: 'in_progress',
      exercises,
      currentExerciseIndex: 0,
    };

    saveActiveSessionLocally();
    renderLiveWorkoutScreen();
  }catch(err){
    console.error(err);
    showToast('تعذر بدء الجلسة. تحقق من الاتصال بالإنترنت.', 'error');
  }
}

/* تحميل آخر أداء واقتراح الوزن لتمرين معين ضمن الجلسة الحالية */
async function loadExerciseSuggestion(exIndex){
  const item = state.activeSession.exercises[exIndex];
  if(!item || item.lastPerformance !== null) return; // محمّل مسبقًا

  const perf = await getLastPerformance(item.exercise.id);
  item.lastPerformance = perf || false;
  if(perf){
    item.suggestion = calculateProgressiveSuggestion(perf.sets, item.target_rep_range);
  }

  // جهّز صفوف المجموعات الفارغة بعدد target_sets
  if(item.sets.length === 0){
    const count = item.target_sets || 3;
    for(let i=0;i<count;i++){
      item.sets.push({
        set_number: i+1,
        weight_kg: item.suggestion ? item.suggestion.weight_kg : null,
        reps: null, rpe: null, rir: null, is_warmup: false, notes: '', checked: false, db_id: null,
      });
    }
  }
  saveActiveSessionLocally();
}

function getWorkoutElapsedSeconds(){
  const started = new Date(state.activeSession.startedAt).getTime();
  return Math.floor((Date.now() - started) / 1000);
}

function startWorkoutTimerDisplay(){
  if(state.workoutTimerIntervalId) clearInterval(state.workoutTimerIntervalId);
  state.workoutTimerIntervalId = setInterval(() => {
    const el = document.getElementById('workout-elapsed');
    if(el) el.textContent = formatTimerMMSS(getWorkoutElapsedSeconds());
  }, 1000);
}

async function renderLiveWorkoutScreen(){

    ? `<div class="suggested-box">الوزن المقترح اليوم: ${item.suggestion.weight_lb} lb (${item.suggestion.weight_kg} kg) — ${escapeHtml(item.suggestion.note)}</div>`

          <div class="ex-name-en">${escapeHtml(ex.name_en)}</div>

      <div class="input-group mt-12">

}

function updateSetField(exIdx, setIdx, field, rawValue){
  const set = state.activeSession.exercises[exIdx].sets[setIdx];
  if(field === 'weight_lb'){
    set.weight_kg = rawValue === '' ? null : lbToKg(parseFloat(rawValue));
  }else if(field === 'reps'){
    set.reps = rawValue === '' ? null : parseInt(rawValue);
  }else if(field === 'rpe'){
    set.rpe = rawValue === '' ? null : parseFloat(rawValue);
  }else if(field === 'rir'){
    set.rir = rawValue === '' ? null : parseInt(rawValue);
  }
  saveActiveSessionLocally();
}

function updateExerciseNote(exIdx, value){
  state.activeSession.exercises[exIdx].notes = value;
  saveActiveSessionLocally();
}

function addWarmupSet(exIdx){
  const item = state.activeSession.exercises[exIdx];
  item.sets.unshift({ set_number: 0, weight_kg:null, reps:null, rpe:null, rir:null, is_warmup:true, notes:'', checked:false, db_id:null });
  saveActiveSessionLocally();
  renderExerciseCards(document.getElementById('live-exercises-list'));
}

function addWorkingSet(exIdx){
  const item = state.activeSession.exercises[exIdx];
  const workingSets = item.sets.filter(s=>!s.is_warmup);
  item.sets.push({ set_number: workingSets.length+1, weight_kg: item.suggestion?item.suggestion.weight_kg:null, reps:null, rpe:null, rir:null, is_warmup:false, notes:'', checked:false, db_id:null });
  saveActiveSessionLocally();
  renderExerciseCards(document.getElementById('live-exercises-list'));
}

/* عند تأكيد مجموعة: نحفظها في Supabase فورًا (أو نضيفها لقائمة الانتظار لو لا يوجد اتصال) */
async function toggleSetChecked(exIdx, setIdx){
  const item = state.activeSession.exercises[exIdx];
  const set = item.sets[setIdx];

  if(!set.checked){
    if(set.weight_kg == null || set.reps == null){
      showToast('أدخل الوزن وعدد التكرارات أولًا', 'error');
      return;
    }
    set.checked = true;
    await persistSet(exIdx, setIdx);

    if(!set.is_warmup){
      const restSeconds = isCompoundExercise(item.exercise) ?
        (state.settings?.rest_time_compound_seconds || 150) :
        (state.settings?.rest_time_isolation_seconds || 90);
      startRestTimer(restSeconds, item.exercise.name_ar);
    }
  }else{
    set.checked = false;
  }
  saveActiveSessionLocally();
  renderExerciseCards(document.getElementById('live-exercises-list'));
}

function isCompoundExercise(exercise){
  return exercise.movement_type === 'compound';
}

/* حفظ مجموعة واحدة في Supabase (تُنشئ workout_exercise عند أول مجموعة لهذا التمرين في الجلسة) */
async function persistSet(exIdx, setIdx){
  const item = state.activeSession.exercises[exIdx];
  const set = item.sets[setIdx];

  try{
    if(!item.db_id){
      const { data, error } = await supabase.from('workout_exercises').insert({
        session_id: state.activeSession.db_id,
        exercise_id: item.exercise.id,
        exercise_name_ar: item.exercise.name_ar,
        exercise_name_en: item.exercise.name_en,
        sort_order: exIdx,
      }).select().single();
      if(error) throw error;
      item.db_id = data.id;
    }

    const { data: setRow, error: setErr } = await supabase.from('workout_sets').insert({
      workout_exercise_id: item.db_id,
      set_number: set.set_number,
      weight_kg: set.weight_kg,
      reps: set.reps,
      rpe: set.rpe,
      rir: set.rir,
      is_warmup: set.is_warmup,
      notes: set.notes || null,
    }).select().single();
    if(setErr) throw setErr;
    set.db_id = setRow.id;

    if(!set.is_warmup){
      const prs = await checkAndRecordPRs(item.exercise.id, set);
      if(prs.length > 0){
        showToast(`رقم شخصي جديد: ${prs.map(p=>PR_LABELS_AR[p]).join('، ')}`, 'success');
      }
    }
  }catch(err){
    console.error(err);
    if(!navigator.onLine){
      queueOfflineOp({ table:'workout_sets', data: { workout_exercise_id: item.db_id, set_number: set.set_number,
        weight_kg: set.weight_kg, reps: set.reps, rpe: set.rpe, rir: set.rir, is_warmup: set.is_warmup } });
      showToast('لا يوجد اتصال — تم حفظ البيانات محليًا وستتم المزامنة عند عودة الإنترنت', '');
    }else{
      showToast('تعذر حفظ المجموعة. حاول مرة أخرى.', 'error');
    }
  }
}

async function confirmCancelWorkout(){
  if(!confirm('هل تريد إلغاء الجلسة الحالية؟ لن يتم حفظها ضمن سجل التمارين.')) return;
  try{
    await supabase.from('workout_sessions').update({ status:'cancelled', ended_at: nowRiyadhISO() }).eq('id', state.activeSession.db_id);
  }catch(e){}
  state.activeSession = null;
  clearActiveSessionLocally();
  if(state.workoutTimerIntervalId) clearInterval(state.workoutTimerIntervalId);
  stopRestTimer();
  navigateTo('today');
}

async function confirmFinishWorkout(){
  const session = state.activeSession;
  const totalSets = session.exercises.reduce((sum,ex)=> sum + ex.sets.filter(s=>s.checked && !s.is_warmup).length, 0);
  if(totalSets === 0){
    if(!confirm('لم تُسجَّل أي مجموعة بعد. هل تريد إنهاء التمرين رغم ذلك؟')) return;
  }
  await finishWorkoutSession();
}

async function finishWorkoutSession(){
  const session = state.activeSession;
  const endedAt = nowRiyadhISO();
  const durationSeconds = getWorkoutElapsedSeconds();

  let totalVolume = 0;
  let totalSetsCount = 0;
  const musclesTrained = new Set();

  session.exercises.forEach(item => {
    item.sets.forEach(s => {
      if(s.checked && !s.is_warmup && s.weight_kg && s.reps){
        totalVolume += s.weight_kg * s.reps;
        totalSetsCount++;
      }
    });
    if(item.sets.some(s=>s.checked)) musclesTrained.add(item.exercise.primary_muscle);
  });

  try{
    await supabase.from('workout_sessions').update({
      ended_at: endedAt,
      duration_seconds: durationSeconds,
      total_volume_kg: Math.round(totalVolume*100)/100,
      total_sets: totalSetsCount,
      muscles_trained: Array.from(musclesTrained),
      status: 'completed',
      session_notes: session.exercises.map(e=>e.notes).filter(Boolean).join(' | ') || null,
    }).eq('id', session.db_id);

    await advanceScheduleAfterCompletion(session.workoutDayId);

    stopRestTimer();
    if(state.workoutTimerIntervalId) clearInterval(state.workoutTimerIntervalId);

    const summary = {
      dayNameAr: session.dayNameAr,
      durationSeconds, totalVolume: Math.round(totalVolume*100)/100,
      exerciseCount: session.exercises.filter(e=>e.sets.some(s=>s.checked)).length,
      setsCount: totalSetsCount,
      endedAt,
    };

    state.activeSession = null;
    clearActiveSessionLocally();

    renderWorkoutSummary(summary);
  }catch(err){
    console.error(err);
    showToast('تعذر إنهاء الجلسة. حاول مرة أخرى.', 'error');
  }
}

   الجزء 10: ملخص التمرين + توصيات التغذية والنوم
   ============================================================ */
function computeNutritionRecommendation(){
  const p = state.profile;
  const weight = p?.weight_kg || 75;
  // تقديرات عامة للتغذية الرياضية (0.3-0.5g بروتين/كغ بعد التمرين، وكارب حسب الهدف)
  const proteinLow = Math.round(weight * 0.3);
  const proteinHigh = Math.round(weight * 0.45);
  const carbLow = Math.round(weight * 0.6);
  const carbHigh = Math.round(weight * 1.0);
  const waterLow = Math.round(weight * 6);
  const waterHigh = Math.round(weight * 9);

  return { proteinLow, proteinHigh, carbLow, carbHigh, waterLow, waterHigh };
}

function computeSleepRecommendation(endedAtISO){
  const p = state.profile;
  const endedDate = new Date(endedAtISO);
  const endHour = endedDate.getHours();

  let advice = '';
  if(endHour >= 22 || endHour < 3){
    advice = 'بما أن التمرين انتهى في وقت متأخر، حاول تهدئة نشاطك تدريجيًا، وتجنب المنبهات مثل الكافيين، واجعل وقت نومك مناسبًا لإعطاء جسمك فرصة كافية للاستشفاء.';
  }else if(endHour >= 19){
    advice = 'انتهى تمرينك في المساء. أعطِ نفسك وقتًا للتهدئة قبل النوم، ويفضل تجنب الشاشات والمنبهات قريبًا من موعد نومك المعتاد.';
  }else{
    advice = 'وقت انتهاء تمرينك مناسب ولن يؤثر على نومك على الأغلب. حافظ على روتين نومك المعتاد لدعم الاستشفاء.';
  }

  if(p?.usual_sleep_time){
    advice += ` وقت نومك المعتاد هو ${p.usual_sleep_time.slice(0,5)} — هذه توصية عامة وليست حقيقة طبية دقيقة.`;
  }
  return advice;
}

   ============================================================ */
const EMERGENCY_REASONS = [
  { key:'could_not', label:'لم أستطع التمرين' },
  { key:'traveling', label:'مسافر' },
  { key:'tired', label:'تعبان' },
  { key:'no_time', label:'وقتي ضيق' },
  { key:'gym_closed', label:'النادي مغلق' },
  { key:'injury', label:'إصابة' },
  { key:'other', label:'سبب آخر' },
];

function openEmergencyModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'emergency-modal';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close" onclick="closeModal('emergency-modal')">✕</button>
      <div class="modal-title">حدث ظرف اليوم</div>
      <div class="flex-col gap-8" id="emergency-reasons"></div>
      <div class="input-group mt-16">
        <label>سبب آخر (اختياري)</label>
        <textarea id="emergency-note" placeholder="اكتب التفاصيل إن وجدت"></textarea>
      </div>
      <button class="btn btn-primary mt-12" onclick="submitEmergencyReschedule()">تأكيد</button>
    </div>`;
  document.body.appendChild(overlay);

  const wrap = document.getElementById('emergency-reasons');
  let selectedReason = null;
  EMERGENCY_REASONS.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.style.justifyContent = 'flex-start';
    btn.textContent = r.label;
    btn.onclick = () => {
      selectedReason = r.key;
      wrap.querySelectorAll('button').forEach(b => b.classList.remove('btn-primary'));
      wrap.querySelectorAll('button').forEach(b => b.classList.add('btn-secondary'));
      btn.classList.remove('btn-secondary'); btn.classList.add('btn-primary');
      overlay.dataset.selectedReason = r.key;
    };
    wrap.appendChild(btn);
  });
}

async function submitEmergencyReschedule(){
  const overlay = document.getElementById('emergency-modal');
  const reason = overlay.dataset.selectedReason;
  const note = document.getElementById('emergency-note').value.trim();

  if(!reason){
    showToast('اختر سببًا أولًا', 'error');
    return;
  }

  await markWorkoutMissed(reason, note);
  closeModal('emergency-modal');

  const nextDay = getNextWorkoutDay();
  showToast(`سنحافظ على ترتيب التمارين — ${nextDay.name_ar} سيكون تمرينك القادم.`, 'success');
  navigateTo('today');
}

function closeModal(id){
  const el = document.getElementById(id);
  if(el) el.remove();
}

function getWeekStartDate(){
  const now = new Date();
  const riyadh = new Date(now.getTime() + (3*60 - now.getTimezoneOffset())*60000);
  const day = riyadh.getDay(); // 0=Sunday
  riyadh.setDate(riyadh.getDate() - day);
  return riyadh.toISOString().slice(0,10);
}

pageRenderers.schedule = async function(main){
  const today = todayDateStr();
  const startDate = new Date(getWeekStartDate());
  const dayNames = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

  const { data: events } = await supabase.from('schedule_events').select('*, workout_days(name_ar)')
    .eq('user_id', state.user.id).gte('event_date', startDate.toISOString().slice(0,10)).order('event_date');

  const eventsByDate = {};
  (events||[]).forEach(e => { eventsByDate[e.event_date] = e; });

  const chips = [];
  for(let i=0;i<7;i++){
    const d = new Date(startDate);
    d.setDate(d.getDate()+i);
    const dateStr = d.toISOString().slice(0,10);
    const ev = eventsByDate[dateStr];
    let statusClass = '';
    let statusLabel = '';
    if(dateStr === today) statusClass += ' today';
    if(ev){
      if(ev.status==='completed'){ statusClass+=' completed'; statusLabel='تم'; }
      else if(ev.status==='missed'){ statusClass+=' missed'; statusLabel='فائت'; }
      else if(ev.status==='skipped'){ statusClass+=' rest'; statusLabel='تخطي'; }
    }
    chips.push(`
      <div class="day-chip${statusClass}">
        <div class="dc-name">${dayNames[d.getDay()]}</div>
        <div class="dc-date">${d.getDate()}</div>
        <div class="dc-status">${statusLabel}</div>
      </div>`);
  }

  const nextDay = getNextWorkoutDay();

  main.innerHTML = `
    <div class="section-title" style="margin-top:0">هذا الأسبوع</div>
    <div class="week-strip">${chips.join('')}</div>

    <div class="section-title">ترتيب البرنامج الأساسي</div>
    <div class="card">
      ${state.workoutDays.map(d => `
        <div class="list-row">
          <div>
            <div class="title">${escapeHtml(d.name_ar)}</div>
            <div class="sub">${escapeHtml(d.name_en)}</div>
          </div>
          ${nextDay && d.id===nextDay.id ? '<span class="badge badge-teal">القادم</span>' : ''}
        </div>`).join('')}
    </div>

    <div class="section-title">سجل الأحداث الأخيرة</div>
    <div class="card">
      ${(events && events.length>0) ? [...events].reverse().slice(0,10).map(e => `
        <div class="list-row">
          <div>
            <div class="title">${escapeHtml(e.workout_days?.name_ar || '—')}</div>
            <div class="sub">${formatDateAr(e.event_date)}${e.reason ? ' — ' + escapeHtml(reasonLabel(e.reason)) : ''}</div>
          </div>
          <span class="badge ${e.status==='completed'?'badge-green':e.status==='missed'?'badge-red':'badge-gray'}">${statusLabelAr(e.status)}</span>
        </div>`).join('') : `<div class="empty-state"><div class="empty-sub">لا يوجد سجل بعد</div></div>`}
    </div>

    <button class="btn btn-ghost mt-16" onclick="openEmergencyModal()">حدث ظرف اليوم</button>
  `;
};

function reasonLabel(key){
  const found = EMERGENCY_REASONS.find(r=>r.key===key);

function statusLabelAr(status){
  return { completed:'مكتمل', missed:'فائت', skipped:'تم تخطيه', rest:'راحة' }[status] || status;
}

async function loadAndRenderExerciseProgress(exerciseId){
  const area = document.getElementById('progress-chart-area');
  area.innerHTML = '<div class="text-center mt-20"><div class="loading-spinner"></div></div>';

  const { data, error } = await supabase
    .from('workout_exercises')
    .select('workout_sets(weight_kg, reps, is_warmup), workout_sessions!inner(started_at, status, user_id)')
    .eq('exercise_id', exerciseId)
    .eq('workout_sessions.user_id', state.user.id)
    .eq('workout_sessions.status', 'completed')
    .limit(200);

  if(error || !data || data.length===0){
    area.innerHTML = `<div class="empty-state"><div class="empty-sub">لا توجد بيانات كافية لعرض تقدم هذا التمرين</div></div>`;
    return;
  }

  // ترتيب تصاعدي حسب تاريخ الجلسة (يدويًا لتفادي قيود ترتيب الجداول المرتبطة)
  data.sort((a,b) => new Date(a.workout_sessions.started_at) - new Date(b.workout_sessions.started_at));

  const points = data.map(rec => {
    const workingSets = (rec.workout_sets||[]).filter(s=>!s.is_warmup && s.weight_kg && s.reps);
    if(workingSets.length===0) return null;
    const maxWeight = Math.max(...workingSets.map(s=>s.weight_kg));
    const volume = workingSets.reduce((sum,s)=>sum+s.weight_kg*s.reps,0);
    return { date: rec.workout_sessions.started_at, maxWeight, volume };
  }).filter(Boolean);

  area.innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0">أعلى وزن مستخدم (lb)</div>
      <div class="chart-wrap">${renderLineChartSVG(points.map(p=>kgToLb(p.maxWeight)), points.map(p=>formatDateAr(p.date)))}</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">حجم التدريب لكل جلسة (lb)</div>
      <div class="chart-wrap">${renderLineChartSVG(points.map(p=>kgToLb(p.volume)), points.map(p=>formatDateAr(p.date)))}</div>
    </div>
    <div class="card">
      <div class="section-title" style="margin-top:0">السجل التفصيلي</div>
      ${points.slice().reverse().map(p => `

/* رسم خطي بسيط بـ SVG بدون مكتبات خارجية */
function renderLineChartSVG(values, labels){
  if(values.length===0) return '<div class="empty-state"><div class="empty-sub">لا توجد بيانات</div></div>';
  const w = Math.max(320, values.length*60);
  const h = 160;
  const padding = 24;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max-min) || 1;

  const pointsCoords = values.map((v,i) => {
    const x = padding + (i/(Math.max(values.length-1,1))) * (w-padding*2);
    const y = h - padding - ((v-min)/range)*(h-padding*2);
    return {x,y,v};
  });

  const pathD = pointsCoords.map((p,i)=> `${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
  const circles = pointsCoords.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#2E9896"/>`).join('');
  const valueLabels = pointsCoords.map(p => `<text x="${p.x}" y="${p.y-10}" font-size="10" fill="#4A5654" text-anchor="middle">${p.v}</text>`).join('');

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${pathD}" fill="none" stroke="#2E9896" stroke-width="2"/>
    ${circles}
    ${valueLabels}
  </svg>`;
}

/* تصدير سجل التمارين كملف CSV بسيط */
async function exportHistoryCSV(){
  const { data } = await supabase.from('workout_sessions').select('*').eq('user_id', state.user.id).eq('status','completed').order('started_at');
  if(!data || data.length===0){ showToast('لا يوجد سجل لتصديره', 'error'); return; }

  const rows = [['التاريخ','التمرين','المدة (دقيقة)','عدد المجموعات','حجم التدريب (kg)','حجم التدريب (lb)']];
  data.forEach(s => {
    rows.push([
      formatDateAr(s.started_at), s.day_name_ar, Math.round((s.duration_seconds||0)/60),
      s.total_sets, s.total_volume_kg, kgToLb(s.total_volume_kg||0)
    ]);
  });

  const csvContent = rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'workout-history.csv';
  a.click();
  URL.revokeObjectURL(url);
}

    <div class="modal-sheet">
      <button class="modal-close" onclick="closeModal('add-ex-session-modal')">✕</button>
      <div class="modal-title">إضافة تمرين للجلسة</div>
      <div class="search-box"><input type="text" id="add-ex-search" placeholder="ابحث..." oninput="filterAddExerciseModal(this.value)"></div>
      <div id="add-ex-list"></div>
    </div>`;
  document.body.appendChild(overlay);
  renderAddExerciseModalList(state.exerciseCache);
}

function filterAddExerciseModal(query){
  const q = query.trim().toLowerCase();
  const filtered = !q ? state.exerciseCache : state.exerciseCache.filter(e =>
    e.name_ar.toLowerCase().includes(q) || e.name_en.toLowerCase().includes(q));
  renderAddExerciseModalList(filtered);
}

function renderAddExerciseModalList(list){
  const container = document.getElementById('add-ex-list');
  container.innerHTML = list.map(e => `
    <div class="lib-row" style="cursor:pointer" onclick="addExerciseToActiveSession('${e.id}')">
      <div class="lr-info">
        <div class="lr-name">${escapeHtml(e.name_ar)}</div>
        <div class="lr-meta">${escapeHtml(e.name_en)}</div>
      </div>
    </div>`).join('');
}

async function addExerciseToActiveSession(exerciseId){
  const exercise = state.exerciseCache.find(e => e.id === exerciseId);
  if(!exercise) return;

  state.activeSession.exercises.push({
    workout_day_exercise_id: null,
    exercise,
    target_sets: exercise.suggested_sets || 3,
    target_rep_range: exercise.suggested_rep_range || '8-12',
    db_id: null,
    lastPerformance: null,
    suggestion: null,
    sets: [],
    notes: '',
    completed: false,
  });

  closeModal('add-ex-session-modal');
  const newIndex = state.activeSession.exercises.length - 1;
  await loadExerciseSuggestion(newIndex);
  saveActiveSessionLocally();
  renderExerciseCards(document.getElementById('live-exercises-list'));
  showToast('تمت إضافة التمرين', 'success');
}
</script>
</body>
</html>
