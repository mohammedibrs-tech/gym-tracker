    await saveTodayCheckin({ decision: 'workout' });
    renderDashboardCheckinArea(nextDay);
  };

  document.getElementById('dash-decide-postpone').onclick = () => {

/* تأجيل تمرين اليوم: يسجَّل بحالة منفصلة عن "تخطي"، ولا يغيّر ترتيب البرنامج (يبقى نفس التمرين غدًا) */
async function postponeTodayWorkout(reason, note){
  const current = getNextWorkoutDay();
  const today = todayDateStr();
  try{
    await sb.from('schedule_events').insert({
      user_id: state.user.id, workout_day_id: current?.id || null, event_date: today,
      status: 'postponed', reason, reason_note: note || null
    });
    // التأجيل لا يغيّر next_workout_day_id — يبقى نفس التمرين مجدولًا لغدًا
    showToast('تم تأجيل التمرين. سيبقى نفس التمرين مجدولًا لك.', 'success');
  }catch(err){
    console.error(err);
  }
}

function getWeekStartDate(){
  const now = new Date();
  const riyadh = new Date(now.getTime() + (3*60 - now.getTimezoneOffset())*60000);
  const day = riyadh.getDay(); // 0=Sunday
  riyadh.setDate(riyadh.getDate() - day);
  return riyadh.toISOString().slice(0,10);
}

/* ============================================================
   الجزء 14: صفحة الجدول (Schedule / Calendar)
   ============================================================ */
pageRenderers.schedule = async function(main){
  const today = todayDateStr();
  const startDate = new Date(getWeekStartDate());
  const dayNames = ['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];

  const { data: events } = await sb.from('schedule_events').select('*, workout_days(name_ar)')
    .eq('user_id', state.user.id).gte('event_date', startDate.toISOString().slice(0,10)).order('event_date');

  const eventsByDate = {};
  (events||[]).forEach(e => { eventsByDate[e.event_date] = e; });

  const chips = [];
  for(let i=0;i<7;i++){
    const d = new Date(startDate);
    d.setDate(d.getDate()+i);
    const dateStr = d.toISOString().slice(0,10);
    const ev = eventsByDate[dateStr];
    let statusClass = '';
    let statusLabel = '';
    if(dateStr === today) statusClass += ' today';
    if(ev){
      if(ev.status==='completed'){ statusClass+=' completed'; statusLabel='تم'; }
      else if(ev.status==='missed'){ statusClass+=' missed'; statusLabel='فائت'; }
      else if(ev.status==='skipped'){ statusClass+=' rest'; statusLabel='تخطي'; }
    }
    chips.push(`
      <div class="day-chip${statusClass}">
        <div class="dc-name">${dayNames[d.getDay()]}</div>
        <div class="dc-date">${d.getDate()}</div>
        <div class="dc-status">${statusLabel}</div>
      </div>`);
  }

  const nextDay = getNextWorkoutDay();

  main.innerHTML = `
    <div class="section-title" style="margin-top:0">هذا الأسبوع</div>
    <div class="week-strip">${chips.join('')}</div>

    <div class="section-title">ترتيب البرنامج الأساسي</div>
    <div class="card">
      ${state.workoutDays.map(d => `
        <div class="list-row">
          <div>
            <div class="title">${escapeHtml(d.name_ar)}</div>
            <div class="sub">${escapeHtml(d.name_en)}</div>
          </div>
          ${nextDay && d.id===nextDay.id ? '<span class="badge badge-teal">القادم</span>' : ''}
        </div>`).join('')}
    </div>

    <div class="section-title">سجل الأحداث الأخيرة</div>
    <div class="card">
      ${(events && events.length>0) ? [...events].reverse().slice(0,10).map(e => `
        <div class="list-row">
          <div>
            <div class="title">${escapeHtml(e.workout_days?.name_ar || '—')}</div>
            <div class="sub">${formatDateAr(e.event_date)}${e.reason ? ' — ' + escapeHtml(reasonLabel(e.reason)) : ''}</div>
          </div>
          <span class="badge ${e.status==='completed'?'badge-green':e.status==='missed'?'badge-red':'badge-gray'}">${statusLabelAr(e.status)}</span>
        </div>`).join('') : `<div class="empty-state"><div class="empty-sub">لا يوجد سجل بعد</div></div>`}
    </div>

    <button class="btn btn-ghost mt-16" onclick="openEmergencyModal()">حدث ظرف اليوم</button>
  `;
};

function reasonLabel(key){

/* الأولوية 3: تراكم العلاقة بين الحالة الشعورية وحجم التدريب عبر الوقت — بيانات حقيقية فقط، بدون اختراع نتائج */
async function renderProgressFeelingTab(){
  const container = document.getElementById('progress-content');
  container.innerHTML = '<div class="text-center mt-20"><div class="loading-spinner"></div></div>';

  const { data, error } = await sb.from('workout_sessions')
    .select('feeling_state, total_volume_kg')
    .eq('user_id', state.user.id).eq('status','completed')
    .not('feeling_state','is', null)
    .order('started_at', { ascending:false }).limit(30);

  if(error || !data || data.length < 4){
    container.innerHTML = `<div class="empty-state"><div class="empty-title">لا توجد بيانات كافية للتحليل بعد</div><div class="empty-sub">سجّل حالتك قبل كل تمرين وأنجز عدة جلسات ليظهر التحليل هنا</div></div>`;
    return;
  }

  const buckets = {};
  data.forEach(s => {
    if(!s.total_volume_kg) return;
    if(!buckets[s.feeling_state]) buckets[s.feeling_state] = [];
    buckets[s.feeling_state].push(s.total_volume_kg);
  });

  const summaries = Object.entries(buckets)
    .filter(([,vals]) => vals.length >= 2)
    .map(([key, vals]) => ({
      key, count: vals.length,
      avg: Math.round(vals.reduce((a,b)=>a+b,0) / vals.length),
    }));

  if(summaries.length < 2){
    container.innerHTML = `<div class="empty-state"><div class="empty-title">لا توجد بيانات كافية للتحليل بعد</div><div class="empty-sub">نحتاج على الأقل حالتين مختلفتين مسجّلتين عبر عدة تمارين للمقارنة</div></div>`;
    return;
  }

  summaries.sort((a,b) => b.avg - a.avg);
  const best = summaries[0];
  const worst = summaries[summaries.length-1];
  const pctDiff = worst.avg > 0 ? Math.round(((best.avg - worst.avg) / worst.avg) * 100) : 0;

  const analysisText = pctDiff > 0
    ? `في آخر ${data.length} تمارين مسجّلة، عندما سجّلت أنك "${FEELING_LABELS_AR[best.key]||best.key}"، كان متوسط حجم التدريب أعلى بنسبة ${pctDiff}% مقارنة بالأيام التي سجّلت فيها أنك "${FEELING_LABELS_AR[worst.key]||worst.key}".`
    : `لا يوجد فرق واضح في حجم التدريب بين حالاتك الشعورية المختلفة حتى الآن.`;

  container.innerHTML = `
    <div class="card">
      <div class="section-title" style="margin-top:0">العلاقة بين شعورك وأداء تمرينك</div>
      <div class="text-sm">${analysisText}</div>
    </div>
    <div class="card">
      ${summaries.map(s => `
        <div class="list-row">
          <div><div class="title">${FEELING_LABELS_AR[s.key]||s.key}</div><div class="sub">${s.count} جلسة</div></div>
          <div>${s.avg} kg متوسط</div>
        </div>`).join('')}
    </div>
  `;
}

/* رسم خطي بسيط بـ SVG بدون مكتبات خارجية */
function renderLineChartSVG(values, labels){
  if(values.length===0) return '<div class="empty-state"><div class="empty-sub">لا توجد بيانات</div></div>';
  const w = Math.max(320, values.length*60);
  const h = 160;
  const padding = 24;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max-min) || 1;

  const pointsCoords = values.map((v,i) => {
    const x = padding + (i/(Math.max(values.length-1,1))) * (w-padding*2);
    const y = h - padding - ((v-min)/range)*(h-padding*2);
    return {x,y,v};
  });

  const pathD = pointsCoords.map((p,i)=> `${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');
  const circles = pointsCoords.map(p => `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#2E9896"/>`).join('');
  const valueLabels = pointsCoords.map(p => `<text x="${p.x}" y="${p.y-10}" font-size="10" fill="#4A5654" text-anchor="middle">${p.v}</text>`).join('');

  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <path d="${pathD}" fill="none" stroke="#2E9896" stroke-width="2"/>
    ${circles}
    ${valueLabels}
  </svg>`;
}

/* إعادة احتساب إجمالي المجموعات وحجم التدريب لجلسة بعد أي تعديل أو حذف */
async function recomputeSessionAggregates(sessionId){
  const { data: exercises } = await sb.from('workout_exercises').select('*, workout_sets(*)').eq('session_id', sessionId);
  let totalVolume = 0, totalSets = 0;
  (exercises || []).forEach(ex => {
    (ex.workout_sets || []).forEach(s => {
      if(!s.is_warmup && s.weight_kg && s.reps){
        totalVolume += s.weight_kg * s.reps;
        totalSets++;
      }
    });
  });
  totalVolume = Math.round(totalVolume * 100) / 100;
  await sb.from('workout_sessions').update({ total_volume_kg: totalVolume, total_sets: totalSets }).eq('id', sessionId);
  return { totalVolume, totalSets };
}

/* حذف أي أرقام قياسية مرتبطة بمجموعات محددة قبل حذفها — لأن العلاقة بقاعدة البيانات SET NULL وليست Cascade،
   فلو ما نظفناها يدويًا، تبقى الأرقام القياسية ظاهرة بلوحة التحكم حتى بعد حذف التمرين الأصلي فعليًا */
/* إعادة حساب الرقم القياسي الحقيقي لتمرين معيّن من البيانات المتبقية فعليًا (تُستخدم بعد أي حذف) */
async function recomputePRForExercise(exerciseId){
  try{
    const { data: exWorkouts } = await sb.from('workout_exercises')
      .select('workout_sets(weight_kg,reps,is_warmup), workout_sessions!inner(user_id,status)')
      .eq('exercise_id', exerciseId)
      .eq('workout_sessions.user_id', state.user.id)
      .eq('workout_sessions.status','completed');

    const bestByType = { max_weight:0, max_reps:0, best_volume:0, estimated_1rm:0 };
    const bestSetByType = { max_weight:null, max_reps:null, best_volume:null, estimated_1rm:null };

    (exWorkouts||[]).forEach(ex => {
      (ex.workout_sets||[]).forEach(s => {
        if(s.is_warmup || !s.weight_kg || !s.reps) return;
        const vol = s.weight_kg * s.reps;
        const e1rm = s.weight_kg * (1 + s.reps/30);
        if(s.weight_kg > bestByType.max_weight){ bestByType.max_weight = s.weight_kg; bestSetByType.max_weight = s; }
        if(s.reps > bestByType.max_reps){ bestByType.max_reps = s.reps; bestSetByType.max_reps = s; }
        if(vol > bestByType.best_volume){ bestByType.best_volume = vol; bestSetByType.best_volume = s; }
        if(e1rm > bestByType.estimated_1rm){ bestByType.estimated_1rm = e1rm; bestSetByType.estimated_1rm = s; }
      });
    });

    for(const type of ['max_weight','max_reps','best_volume','estimated_1rm']){
      const bestSet = bestSetByType[type];
      if(bestSet){
        await sb.from('personal_records').insert({
          user_id: state.user.id, exercise_id: exerciseId, record_type: type,
          value: Math.round(bestByType[type]*100)/100, weight_kg: bestSet.weight_kg, reps: bestSet.reps,
        });
      }
      // لو ما بقيت أي مجموعة فعلية لهذا التمرين، نتركه بدون رقم قياسي — هذا صحيح، لا نخترع قيمة
    }
  }catch(err){
    console.error(err);
  }
}

async function cleanupPersonalRecordsForSets(setIds){
  if(!setIds || setIds.length === 0) return;
  try{
    const { data: affected } = await sb.from('personal_records').select('exercise_id').in('workout_set_id', setIds);
    const affectedExerciseIds = [...new Set((affected||[]).map(r=>r.exercise_id).filter(Boolean))];

    await sb.from('personal_records').delete().in('workout_set_id', setIds);

    for(const exId of affectedExerciseIds){
      await recomputePRForExercise(exId);
    }
  }catch(err){
    console.error(err);
  }
}

async function deleteHistorySet(sessionId, setId){
  if(!confirm('هل تريد حذف هذه المجموعة؟')) return;
  try{
    await cleanupPersonalRecordsForSets([setId]);
    const { error } = await sb.from('workout_sets').delete().eq('id', setId);
    if(error) throw error;
    await recomputeSessionAggregates(sessionId);
    await renderSessionDetailContent(sessionId);
    showToast('تم الحذف', 'success');
  }catch(err){
    console.error(err);
    showToast('تعذر الحذف: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}

/* مشاركة تمرين محفوظ سابقًا من السجل */
/* حذف تمرين محفوظ بالكامل — يحذف الجلسة وكل تمارينها ومجموعاتها، وحدث الجدولة المطابق، كأن التمرين لم يحدث إطلاقًا */
async function deleteEntireSession(sessionId){
  if(!confirm('هل تريد حذف هذا التمرين بالكامل؟ سيُحذف نهائيًا من السجل والإحصائيات ولن تستطيع التراجع عن هذا الإجراء.')) return;

  try{
    const { data: session } = await sb.from('workout_sessions').select('*').eq('id', sessionId).single();

    // نجمع كل معرّفات المجموعات بهذي الجلسة وننظف أرقامها القياسية قبل الحذف (العلاقة SET NULL وليست Cascade)
    const { data: exercises } = await sb.from('workout_exercises').select('id, workout_sets(id)').eq('session_id', sessionId);
    const allSetIds = (exercises||[]).flatMap(ex => (ex.workout_sets||[]).map(s=>s.id));
    await cleanupPersonalRecordsForSets(allSetIds);

    const { error } = await sb.from('workout_sessions').delete().eq('id', sessionId);
    if(error) throw error;

    // نحذف حدث الجدولة المطابق (نفس اليوم والتاريخ) إن وُجد، حتى يعكس السجل عدم حدوث هذا التمرين فعليًا
    if(session && session.workout_day_id){
      const eventDate = session.started_at.slice(0,10);
      await sb.from('schedule_events').delete()
        .eq('user_id', state.user.id).eq('workout_day_id', session.workout_day_id)
        .eq('event_date', eventDate).eq('status','completed');
    }

    showToast('تم حذف التمرين بالكامل', 'success');
    navigateTo('history');
  }catch(err){
    console.error(err);
    showToast('تعذر الحذف: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}

async function shareHistorySession(sessionId){
  try{
    const { data: session } = await sb.from('workout_sessions').select('*').eq('id', sessionId).single();
    const { data: exercises } = await sb.from('workout_exercises').select('*, workout_sets(*)').eq('session_id', sessionId).order('sort_order');

    let maxWeightKgOverall = 0;
    const allSetIds = [];
    const exerciseBreakdown = (exercises || []).map(ex => {
      const workingSets = (ex.workout_sets || []).filter(s => !s.is_warmup && s.weight_kg && s.reps);
      workingSets.forEach(s => { allSetIds.push(s.id); if(s.weight_kg > maxWeightKgOverall) maxWeightKgOverall = s.weight_kg; });
      if(workingSets.length === 0) return null;
      const maxSet = workingSets.reduce((max,s)=> (s.weight_kg>max.weight_kg?s:max), workingSets[0]);
      return { name_ar: ex.exercise_name_ar, setsCount: workingSets.length, topWeightKg: maxSet.weight_kg||0, topReps: maxSet.reps||0 };
    }).filter(Boolean);

    // نستخرج الأرقام القياسية (أعلى وزن) اللي تحققت فعليًا ضمن مجموعات هذه الجلسة تحديدًا
    let personalRecords = [];
    if(allSetIds.length > 0){
      const { data: prRows } = await sb.from('personal_records')
        .select('*, exercises(name_ar)')
        .eq('user_id', state.user.id).eq('record_type','max_weight')
        .in('workout_set_id', allSetIds);
      personalRecords = (prRows || []).map(pr => ({
        exercise_name_ar: pr.exercises?.name_ar || '', weight_kg: pr.weight_kg, reps: pr.reps,
      }));
    }

    const comparison = await getPreviousSessionComparison(session, maxWeightKgOverall || null);

    const summary = {
      dayNameAr: session.day_name_ar,
      dayNameEn: session.day_name_en,
      durationSeconds: session.duration_seconds,
      totalVolume: session.total_volume_kg || 0,
      setsCount: session.total_sets || 0,
      exerciseCount: exerciseBreakdown.length,
      endedAt: session.ended_at || session.started_at,
      exerciseBreakdown,
      personalRecords,
      comparison,
    };

    await shareWorkoutSummaryImage(summary);
  }catch(err){
    console.error(err);
    showToast('تعذر تجهيز صورة المشاركة', 'error');
  }
}

/* تصدير سجل التمارين كملف CSV بسيط */
async function exportHistoryCSV(){
  const { data } = await sb.from('workout_sessions').select('*').eq('user_id', state.user.id).eq('status','completed').order('started_at');
  if(!data || data.length===0){ showToast('لا يوجد سجل لتصديره', 'error'); return; }

  const rows = [['التاريخ','التمرين','المدة (دقيقة)','عدد المجموعات','حجم التدريب (kg)']];
  data.forEach(s => {
    rows.push([
      formatDateAr(s.started_at), s.day_name_ar, Math.round((s.duration_seconds||0)/60),
      s.total_sets, s.total_volume_kg
    ]);
  });

  const csvContent = rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'workout-history.csv';
  a.click();
  URL.revokeObjectURL(url);
}

function getSessionExercisePool(){

    return state.exerciseCache.filter(e => restricted.includes(e.primary_muscle));

  const pool = getSessionExercisePool();
  const filtered = !q ? pool : pool.filter(e =>
    e.name_ar.toLowerCase().includes(q) || e.name_en.toLowerCase().includes(q));
  // أثناء البحث النصي نعرض قائمة مسطّحة بسيطة، والتقسيم فقط بالعرض الافتراضي بدون بحث

  renderAddExerciseModalList(filtered, !q && isRestricted);

function groupExercisesByCategory(list){
  const groups = {};
  const noCategory = [];
  list.forEach(e => {
    if(!e.category_id){ noCategory.push(e); return; }
    const cat = state.categoryCache.find(c => c.id === e.category_id);
    if(!cat){ noCategory.push(e); return; }
    if(!groups[cat.id]) groups[cat.id] = { label: cat.name_ar, sort: cat.sort_order ?? 999, items: [] };
    groups[cat.id].items.push(e);
  });
  const result = Object.values(groups).sort((a,b) => a.sort - b.sort);
  if(noCategory.length > 0) result.push({ label: 'تمارين أخرى', sort: 999, items: noCategory });
  return result;
}

function renderAddExerciseModalList(list, grouped){
  const container = document.getElementById('add-ex-list');
  if(list.length === 0){
    container.innerHTML = `<div class="empty-state"><div class="empty-sub">لا توجد تمارين لهذه العضلة بعد — أضفها من مكتبة التمارين بالإعدادات</div></div>`;
    return;
  }

  const rowHtml = e => `
    <div class="lib-row" style="cursor:pointer" onclick="addExerciseToActiveSession('${e.id}')">
      ${renderExerciseIcon(e, 34)}
      <div class="lr-info">
        <div class="lr-name">${escapeHtml(e.name_ar)}</div>
        <div class="lr-meta">${escapeHtml(e.name_en)}</div>
      </div>
    </div>`;

  if(grouped){
    const groups = groupExercisesByCategory(list);
    container.innerHTML = groups.map(g => `
      <div class="section-title" style="margin:14px 0 6px; font-size:12px;">${escapeHtml(g.label)}</div>
      ${g.items.map(rowHtml).join('')}
    `).join('');
    return;
  }

  container.innerHTML = list.map(rowHtml).join('');
}

async function addExerciseToActiveSession(exerciseId){
  const exercise = state.exerciseCache.find(e => e.id === exerciseId);
  if(!exercise) return;

  state.activeSession.exercises.push({
    workout_day_exercise_id: null,
    exercise,
    target_sets: exercise.suggested_sets || 3,
    target_rep_range: exercise.suggested_rep_range || '8-12',
    db_id: null,
    lastPerformance: null,
    suggestion: null,
    sets: [],
    notes: '',
    completed: false,
  });

  closeModal('add-ex-session-modal');
  const newIndex = state.activeSession.exercises.length - 1;
  await loadExerciseSuggestion(newIndex);
  saveActiveSessionLocally();
  renderExerciseCards(document.getElementById('live-exercises-list'));
  showToast('تمت إضافة التمرين', 'success');
}

/* ============================================================
   الجزء 21: تعديل برنامج التمارين (ترتيب مرن مخصص بالكامل)
   ============================================================ */
pageRenderers['program-editor'] = function(main){
  const days = [...state.workoutDays].sort((a,b)=>a.day_order-b.day_order);

  main.innerHTML = `
    <button class="btn btn-ghost" onclick="navigateTo('settings')">→ رجوع للإعدادات</button>
    <div class="section-title">ترتيب برنامجك</div>
    <div class="text-sm text-faint mb-12">هذا هو تسلسل تمارينك — يتبعه التطبيق بالدور بغض النظر عن اسم اليوم في التقويم. رتّبه أو عدّله كما تحب.</div>
    <div id="program-days-list"></div>
    <button class="btn btn-primary mt-16" onclick="openAddProgramDayModal()">+ إضافة يوم جديد</button>
  `;
  renderProgramDaysList();
};

function renderProgramDaysList(){
  const container = document.getElementById('program-days-list');
  const days = [...state.workoutDays].sort((a,b)=>a.day_order-b.day_order);

  if(days.length === 0){
    container.innerHTML = `<div class="empty-state"><div class="empty-sub">لا يوجد أي يوم بعد — أضف أول يوم لبرنامجك</div></div>`;
    return;
  }

  container.innerHTML = days.map((d, idx) => `
    <div class="card">
      <div class="list-row">
        <div>
          <div class="title">${escapeHtml(d.name_ar)}</div>
          <div class="sub">${escapeHtml(d.name_en)} — ${(d.workout_day_exercises||[]).length} تمرين</div>
        </div>
        <div class="flex gap-8">
          <button class="icon-btn-sm" onclick="moveProgramDay('${d.id}', -1)" ${idx===0?'disabled':''}>↑</button>
          <button class="icon-btn-sm" onclick="moveProgramDay('${d.id}', 1)" ${idx===days.length-1?'disabled':''}>↓</button>
        </div>
      </div>
      <div class="flex gap-8 mt-8">
        <button class="btn btn-secondary btn-sm" style="flex:1" onclick="openDayExercisesEditor('${d.id}')">تعديل التمارين</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProgramDay('${d.id}')">حذف اليوم</button>
      </div>
    </div>
  `).join('');
}

async function moveProgramDay(dayId, direction){
  const days = [...state.workoutDays].sort((a,b)=>a.day_order-b.day_order);
  const idx = days.findIndex(d=>d.id===dayId);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= days.length) return;

  const a = days[idx], b = days[swapIdx];
  const aOrder = a.day_order, bOrder = b.day_order;

  try{
    await Promise.all([
      sb.from('workout_days').update({ day_order: bOrder }).eq('id', a.id),
      sb.from('workout_days').update({ day_order: aOrder }).eq('id', b.id),
    ]);
    a.day_order = bOrder; b.day_order = aOrder;
    renderProgramDaysList();
  }catch(err){
    console.error(err);
    showToast('تعذر تغيير الترتيب. حاول مرة أخرى.', 'error');
  }
}

function openAddProgramDayModal(){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'add-day-modal';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close" onclick="closeModal('add-day-modal')">✕</button>
      <div class="modal-title">إضافة يوم جديد لبرنامجك</div>
      <div class="input-group"><label>اسم اليوم بالعربي</label><input type="text" id="new-day-name-ar" placeholder="مثال: صدر وترايسبس"></div>
      <div class="input-group"><label>اسم اليوم بالإنجليزي</label><input type="text" id="new-day-name-en" placeholder="Example: Chest and Triceps"></div>
      <button class="btn btn-primary" onclick="submitAddProgramDay()">إضافة</button>
    </div>`;
  document.body.appendChild(overlay);
}

async function submitAddProgramDay(){
  const nameAr = document.getElementById('new-day-name-ar').value.trim();
  const nameEn = document.getElementById('new-day-name-en').value.trim();
  if(!nameAr){ showToast('اكتب اسم اليوم أولًا', 'error'); return; }

  const maxOrder = state.workoutDays.length > 0 ? Math.max(...state.workoutDays.map(d=>d.day_order)) : 0;

  try{
    const { data, error } = await sb.from('workout_days').insert({
      user_id: state.user.id, day_order: maxOrder + 1, name_ar: nameAr, name_en: nameEn || nameAr, muscle_groups: []
    }).select().single();
    if(error) throw error;

    data.workout_day_exercises = [];
    state.workoutDays.push(data);
    closeModal('add-day-modal');
    renderProgramDaysList();
    showToast('تمت إضافة اليوم', 'success');
  }catch(err){
    console.error(err);
    showToast('تعذر الإضافة: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}

async function deleteProgramDay(dayId){
  if(!confirm('هل تريد حذف هذا اليوم من برنامجك؟ سيُحذف مع كل تمارينه المرتبطة به.')) return;

  try{
    const { error } = await sb.from('workout_days').delete().eq('id', dayId);
    if(error) throw error;

    state.workoutDays = state.workoutDays.filter(d => d.id !== dayId);

    // إذا كان هذا اليوم هو "القادم" بالجدولة، ننقلها لأول يوم متبقي لتفادي مرجع معلّق
    if(state.scheduleState?.next_workout_day_id === dayId){
      const fallback = state.workoutDays.sort((a,b)=>a.day_order-b.day_order)[0];
      if(fallback){
        await sb.from('schedule_state').update({ next_workout_day_id: fallback.id }).eq('user_id', state.user.id);
        state.scheduleState.next_workout_day_id = fallback.id;
      }
    }

    renderProgramDaysList();
    showToast('تم حذف اليوم', 'success');
  }catch(err){
    console.error(err);
    showToast('تعذر الحذف: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}

/* ============================================================
   محرر تمارين يوم معيّن — مع خياري المصدر: مقترحة / تماريني الخاصة
   ============================================================ */
let currentEditingDayId = null;

function openDayExercisesEditor(dayId){
  currentEditingDayId = dayId;
  const day = state.workoutDays.find(d => d.id === dayId);
  if(!day) return;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'day-exercises-modal';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <button class="modal-close" onclick="closeModal('day-exercises-modal')">✕</button>
      <div class="modal-title">تمارين: ${escapeHtml(day.name_ar)}</div>
      <div id="day-exercises-current"></div>
      <div class="divider"></div>
      <div class="section-title" style="margin-top:0">إضافة تمرين لهذا اليوم</div>
      <div class="tab-bar">
        <button class="tab-btn active" data-src="suggested" onclick="switchExercisePickerSource('suggested')">تمارين مقترحة</button>
        <button class="tab-btn" data-src="mine" onclick="switchExercisePickerSource('mine')">تماريني الخاصة</button>
      </div>
      <div class="search-box"><input type="text" id="day-ex-search" placeholder="ابحث..." oninput="filterDayExercisePicker(this.value)"></div>
      <div id="day-exercise-picker-list"></div>
    </div>`;
  document.body.appendChild(overlay);

  renderDayCurrentExercises();
  switchExercisePickerSource('suggested');
}

function renderDayCurrentExercises(){
  const container = document.getElementById('day-exercises-current');
  const day = state.workoutDays.find(d => d.id === currentEditingDayId);
  const list = (day.workout_day_exercises || []).sort((a,b)=>a.sort_order-b.sort_order);

  if(list.length === 0){
    container.innerHTML = `<div class="empty-state"><div class="empty-sub">لا توجد تمارين مضافة بعد لهذا اليوم</div></div>`;
    return;
  }

  container.innerHTML = list.map(wde => `
    <div class="lib-row">
      ${renderExerciseIcon(wde.exercises, 34)}
      <div class="lr-info">
        <div class="lr-name">${escapeHtml(wde.exercises.name_ar)}</div>
        <div class="lr-meta">${escapeHtml(wde.exercises.name_en)} — ${wde.target_sets} × ${escapeHtml(wde.target_rep_range)}</div>
      </div>
      <button class="icon-btn-sm" onclick="removeExerciseFromDay('${wde.id}')">✕</button>
    </div>
  `).join('');
}

let exercisePickerSource = 'suggested';
function switchExercisePickerSource(source){
  exercisePickerSource = source;
  document.querySelectorAll('#day-exercises-modal .tab-btn').forEach(b => b.classList.toggle('active', b.dataset.src===source));
  filterDayExercisePicker(document.getElementById('day-ex-search')?.value || '');
}

function filterDayExercisePicker(query){
  const q = query.trim().toLowerCase();
  const pool = exercisePickerSource === 'suggested'
    ? state.exerciseCache.filter(e => e.is_default)
    : state.exerciseCache.filter(e => e.user_id === state.user.id);

  const filtered = !q ? pool : pool.filter(e =>
    e.name_ar.toLowerCase().includes(q) || e.name_en.toLowerCase().includes(q));

  const container = document.getElementById('day-exercise-picker-list');
  if(filtered.length === 0){
    container.innerHTML = `<div class="empty-state"><div class="empty-sub">${exercisePickerSource==='mine' ? 'ما عندك تمارين خاصة بعد — أضفها من مكتبة التمارين بالإعدادات' : 'لا توجد نتائج'}</div></div>`;
    return;
  }

  container.innerHTML = filtered.map(e => `
    <div class="lib-row" style="cursor:pointer" onclick="addExerciseToDay('${e.id}')">
      <div class="lr-info">
        <div class="lr-name">${escapeHtml(e.name_ar)}</div>
        <div class="lr-meta">${escapeHtml(e.name_en)}</div>
      </div>
    </div>`).join('');
}

async function addExerciseToDay(exerciseId){
  const day = state.workoutDays.find(d => d.id === currentEditingDayId);
  const exercise = state.exerciseCache.find(e => e.id === exerciseId);
  if(!day || !exercise) return;

  const currentList = day.workout_day_exercises || [];
  if(currentList.some(wde => wde.exercise_id === exerciseId)){
    showToast('هذا التمرين مضاف بالفعل لهذا اليوم', 'error');
    return;
  }

  try{
    const { data, error } = await sb.from('workout_day_exercises').insert({
      workout_day_id: day.id, exercise_id: exerciseId,
      sort_order: currentList.length, target_sets: exercise.suggested_sets || 3,
      target_rep_range: exercise.suggested_rep_range || '8-12',
    }).select().single();
    if(error) throw error;

    data.exercises = exercise;
    day.workout_day_exercises = [...currentList, data];
    renderDayCurrentExercises();
    showToast('تمت الإضافة', 'success');
  }catch(err){
    console.error(err);
    showToast('تعذر الإضافة: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}

async function removeExerciseFromDay(workoutDayExerciseId){
  const day = state.workoutDays.find(d => d.id === currentEditingDayId);
  if(!day) return;

  try{
    const { error } = await sb.from('workout_day_exercises').delete().eq('id', workoutDayExerciseId);
    if(error) throw error;

    day.workout_day_exercises = (day.workout_day_exercises||[]).filter(wde => wde.id !== workoutDayExerciseId);
    renderDayCurrentExercises();
    renderProgramDaysList();
    showToast('تم الحذف', 'success');
  }catch(err){
    console.error(err);
    showToast('تعذر الحذف: ' + (err.message || 'خطأ غير معروف'), 'error');
  }
}
</script>
